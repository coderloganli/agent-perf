# Parallel subagents on vs off, same Harbor tasks.
# `agent-perf run examples/subagents.toml --dry-run` prints the harbor commands.

[experiment]
name = "subagents"
harness = "claude-code"          # "claude-code" or "codex"
model = "REPLACE_WITH_MODEL"     # passed to `harbor run -m`
dataset = "REPLACE_WITH_DATASET" # Harbor registry dataset (org/dataset@ref); or use `path`
# path = "path/to/local/tasks"
n_concurrent = 4
n_attempts = 1
jobs_dir = "jobs"
traces_dir = "traces"

[proxy]
bind = "0.0.0.0"
port = 8787
# Address of this machine as seen from inside Harbor's sandbox containers.
container_host = "host.docker.internal"
